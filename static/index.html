<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL threat scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0A0C10;
    --surface: #12161D;
    --surface-2: #171C25;
    --border: #232A36;
    --border-soft: #1B212B;
    --text: #E7E9EE;
    --text-2: #8A93A3;
    --text-3: #565E6B;
    --accent: #4F7CFF;
    --accent-dim: #1D2A4D;
    --danger: #FF5C5C;
    --danger-dim: #3A1A1A;
    --safe: #37D399;
    --safe-dim: #123328;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(79,124,255,0.06), transparent 55%),
      radial-gradient(circle at 80% 100%, rgba(55,211,153,0.04), transparent 55%);
  }

  .wrap{
    position:relative;
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    color: var(--text-3);
    text-transform: uppercase;
    margin-bottom:14px;
  }

  .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--safe);
    box-shadow: 0 0 0 3px var(--safe-dim);
  }

  h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 30px;
    line-height:1.25;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  h1 span{ color: var(--accent); }

  .sub{
    color: var(--text-2);
    font-size: 14.5px;
    line-height:1.6;
    margin: 0 0 36px;
    max-width: 52ch;
  }

  .scan-card{
    position:relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    overflow:hidden;
  }

  .scan-card.scanning::after{
    content:"";
    position:absolute;
    top:0; left:-40%;
    width:40%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(79,124,255,0.16), transparent);
    animation: sweep 1.1s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .scan-card.scanning::after{ animation: none; display:none; }
  }
  @keyframes sweep{
    from{ left:-40%; }
    to{ left: 100%; }
  }

  .input-row{
    display:flex;
    gap:8px;
    position:relative;
    z-index:1;
  }

  #url-input{
    flex:1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    min-width:0;
    transition: border-color .15s ease;
  }
  #url-input::placeholder{ color: var(--text-3); }
  #url-input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  #check-btn{
    flex-shrink:0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
    display:flex; align-items:center; gap:8px;
  }
  #check-btn:hover{ filter: brightness(1.1); }
  #check-btn:active{ transform: scale(0.98); }
  #check-btn:disabled{ opacity: 0.55; cursor: default; }
  #check-btn:focus-visible, #url-input:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .spinner{
    width:14px; height:14px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
    display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .hint{
    font-size:12px;
    color: var(--text-3);
    margin: 10px 2px 0;
    font-family:'JetBrains Mono', monospace;
  }

  /* ── result panel ───────────────────── */

  #result-area{ margin-top: 22px; }

  .result-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    animation: rise .25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .verdict-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .verdict-badge{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .verdict-icon{
    width: 30px; height:30px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .phishing .verdict-icon{ background: var(--danger-dim); color: var(--danger); }
  .phishing .verdict-badge{ color: var(--danger); }
  .legit .verdict-icon{ background: var(--safe-dim); color: var(--safe); }
  .legit .verdict-badge{ color: var(--safe); }

  .confidence-pill{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 999px;
  }

  .meter{
    height:5px;
    background: var(--surface-2);
    border-radius: 4px;
    margin: 16px 0 4px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    border-radius:4px;
    transition: width .4s ease;
  }
  .phishing .meter-fill{ background: var(--danger); }
  .legit .meter-fill{ background: var(--safe); }

  .checked-url{
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-3);
    word-break: break-all;
    margin: 14px 0 0;
  }

  .meta-row{
    display:flex;
    gap: 18px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .meta-item{
    font-size:12px;
    color: var(--text-3);
    font-family:'JetBrains Mono', monospace;
  }
  .meta-item b{ color: var(--text-2); font-weight:500; }

  .signals{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .signals-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    font-family:'JetBrains Mono', monospace;
    margin-bottom: 10px;
  }
  .signal-tag{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text);
    background: var(--surface-2);
    border-left: 2px solid var(--danger);
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .error-card{
    background: var(--danger-dim);
    border: 1px solid rgba(255,92,92,0.3);
    color: #FFB3B3;
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13.5px;
    font-family:'JetBrains Mono', monospace;
  }

  /* ── history ───────────────────── */

  #history-section{ margin-top: 40px; }
  .history-label{
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    font-family:'JetBrains Mono', monospace;
    margin-bottom: 12px;
  }
  #history-list{
    display:flex;
    flex-direction:column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
  }
  .history-item{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  .history-dot{
    width:7px; height:7px; border-radius:50%;
    flex-shrink:0;
  }
  .history-item.phishing .history-dot{ background: var(--danger); }
  .history-item.legit .history-dot{ background: var(--safe); }
  .history-url{
    flex:1;
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-conf{
    color: var(--text-3);
    flex-shrink:0;
  }

  #history-list::-webkit-scrollbar{ width:6px; }
  #history-list::-webkit-scrollbar-thumb{ background: var(--border); border-radius:3px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow"><span class="dot"></span> live · model rf-v1.1.1</div>
  <h1>URL threat <span>scanner</span></h1>
  <p class="sub">Paste a URL below to check it against the phishing detection model — structural analysis plus domain-age calibration, explained signal by signal.</p>

  <div class="scan-card" id="scan-card">
    <div class="input-row">
      <input
        id="url-input"
        type="text"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="paste-a-url-to-check.example.com/path"
        aria-label="URL to check"
      >
      <button id="check-btn" type="button">
        <span class="spinner" id="spinner"></span>
        <span id="btn-label">Check URL</span>
      </button>
    </div>
  </div>
  <div class="hint">enter to scan · connects to POST /predict</div>

  <div id="result-area"></div>

  <div id="history-section" style="display:none">
    <div class="history-label">recent checks</div>
    <div id="history-list"></div>
  </div>

</div>

<script>
  const API_BASE_URL = "http://127.0.0.1:8000";

  const input = document.getElementById('url-input');
  const btn = document.getElementById('check-btn');
  const btnLabel = document.getElementById('btn-label');
  const spinner = document.getElementById('spinner');
  const scanCard = document.getElementById('scan-card');
  const resultArea = document.getElementById('result-area');
  const historySection = document.getElementById('history-section');
  const historyList = document.getElementById('history-list');

  let history = [];
  const MAX_HISTORY = 10;

  const iconCheck = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const iconAlert = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>';

  function setLoading(isLoading){
    btn.disabled = isLoading;
    spinner.classList.toggle('show', isLoading);
    btnLabel.textContent = isLoading ? 'Scanning…' : 'Check URL';
    scanCard.classList.toggle('scanning', isLoading);
  }

  function formatAge(days){
    if(days === undefined || days === null || days === -1){
      return 'unknown';
    }
    if(days < 365) return days + ' days';
    return days + ' days (~' + (days/365).toFixed(1) + ' yrs)';
  }

  function renderResult(data){
    const isPhishing = data.verdict === 'phishing';
    const pct = Math.round((data.confidence || 0) * 100);
    const cls = isPhishing ? 'phishing' : 'legit';

    let signalsHtml = '';
    if(isPhishing && Array.isArray(data.reasons) && data.reasons.length){
      signalsHtml = `
        <div class="signals">
          <div class="signals-label">signals fired</div>
          ${data.reasons.map(r => `<span class="signal-tag">${escapeHtml(r)}</span>`).join('')}
        </div>`;
    }

    resultArea.innerHTML = `
      <div class="result-card ${cls}">
        <div class="verdict-row">
          <div class="verdict-badge">
            <span class="verdict-icon">${isPhishing ? iconAlert : iconCheck}</span>
            ${isPhishing ? 'Phishing detected' : 'Looks legitimate'}
          </div>
          <span class="confidence-pill">${pct}% confidence</span>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${pct}%"></div></div>
        <p class="checked-url">${escapeHtml(data.url || '')}</p>
        <div class="meta-row">
          <span class="meta-item">domain age: <b>${formatAge(data.domain_age_days)}</b></span>
        </div>
        ${signalsHtml}
      </div>
    `;

    pushHistory({ url: data.url, verdict: data.verdict, confidence: pct });
  }

  function renderError(message){
    resultArea.innerHTML = `<div class="error-card">${escapeHtml(message)}</div>`;
  }

  function pushHistory(entry){
    history.unshift(entry);
    if(history.length > MAX_HISTORY) history.pop();
    historySection.style.display = history.length ? 'block' : 'none';
    historyList.innerHTML = history.map(h => `
      <div class="history-item ${h.verdict === 'phishing' ? 'phishing' : 'legit'}">
        <span class="history-dot"></span>
        <span class="history-url">${escapeHtml(h.url)}</span>
        <span class="history-conf">${h.confidence}%</span>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function checkUrl(){
    const url = input.value.trim();
    if(!url){
      renderError('Enter a URL to check.');
      return;
    }

    setLoading(true);
    resultArea.innerHTML = '';

    try{
      const response = await fetch(`${API_BASE_URL}/predict`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      if(!response.ok){
        let detail = 'Could not process this URL.';
        try{
          const errBody = await response.json();
          if(errBody && errBody.detail) detail = errBody.detail;
        }catch(_e){}
        renderError(detail);
        return;
      }

      const data = await response.json();
      renderResult(data);

    }catch(err){
      renderError('Could not reach the detection API. Is the server running?');
    }finally{
      setLoading(false);
    }
  }

  btn.addEventListener('click', checkUrl);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkUrl();
  });
</script>
</body>
</html>
